<style>
/* Dokulo design tokens + component styles (light theme) */
.ph,.dkb{--p:#2251E6;--op:#FFFFFF;--pp:#1A41BD;--pc:#E6ECFF;--opc:#0F2A8A;--bg:#F7F8FA;--sf:#FFFFFF;--sk:#EEF1F5;--ol:#D9DEE6;--ols:#B8C0CC;--t1:#14171C;--t2:#5A6270;--t3:#9AA1AD;--ic:#2E3440;--ic2:#6B7380;--pro:#8A5A0B;--proc:#FFF4DD;--ok:#13804F;--okc:#E3F5EC;--wr:#B54708;--wrc:#FFF1E0;--dg:#C8281E;--dgc:#FDECEA;--ff:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;--mf:"SF Mono",ui-monospace,Menlo,"Roboto Mono",monospace;--sfr:#FFFFFF;--bar:rgba(255,255,255,.94);--swoff:#D3D8E0;--pcs:#F2F5FF;--wrf:#7A2E05;--dgf:#8F1A13;--prof:#5E3D07;--invb:#14171C;--invf:#FFFFFF;--inva:#8AA8FF;--addb:#D9F2E2;--pageDim:none}

.ph{width:393px;height:852px;position:relative;overflow:hidden;background:var(--bg);color:var(--t1);font:400 16px/24px var(--ff);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;box-sizing:border-box}
.ph.se{width:375px;height:667px}
.ph.land{width:852px;height:393px}
.dkb{background:var(--bg);color:var(--t1);font:400 16px/24px var(--ff);-webkit-font-smoothing:antialiased;box-sizing:border-box}
:where(.ph,.dkb) button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
:where(.ph,.dkb) a{color:inherit;text-decoration:none;cursor:pointer}
.ph input,.ph textarea{font:inherit;color:inherit;outline:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
/* icons */
.i{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;flex:none;user-select:none}
.i.f{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.i12{font-size:12px}.i14{font-size:14px}.i16{font-size:16px}.i18{font-size:18px}.i20{font-size:20px}.i28{font-size:28px}.i32{font-size:32px}.i40{font-size:40px}.i48{font-size:48px}.i56{font-size:56px}.i64{font-size:64px}
/* layout helpers */
.col{display:flex;flex-direction:column}.rw{display:flex;align-items:center}.wrap{flex-wrap:wrap}
.g2{gap:2px}.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}.g32{gap:32px}
.f1{flex:1;min-width:0}.sb{justify-content:space-between}.cc{align-items:center;justify-content:center}.ac{align-items:center}.as{align-items:flex-start}.je{justify-content:flex-end}
.px{padding-left:16px;padding-right:16px}.p16{padding:16px}.p12{padding:12px}.p24{padding:24px}
.st{height:54px;flex:none}.hi{height:34px;flex:none}
.bd{flex:1;overflow:auto;min-height:0;position:relative}
.ctr{text-align:center}.rel{position:relative}.nw{white-space:nowrap}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* type */
.t-d{font:700 28px/34px var(--ff);letter-spacing:-.3px}
.t-l{font:700 22px/28px var(--ff);letter-spacing:-.2px}
.t-m{font:600 18px/24px var(--ff);letter-spacing:-.1px}
.t-s{font:600 16px/22px var(--ff)}
.b-l{font:400 16px/24px var(--ff)}

.s2{color:var(--t2)}.s3{color:var(--t3)}.cp{color:var(--p)}.cok{color:var(--ok)}.cdg{color:var(--dg)}.cwr{color:var(--wr)}.cpro{color:var(--pro)}.cic{color:var(--ic)}.cic2{color:var(--ic2)}.cw{color:#fff}

.ton2{background:var(--pc);color:var(--opc)}
/* tab bar */
.tab{flex:none;background:var(--sf);border-top:1px solid var(--ol);display:grid;grid-template-columns:1fr 1fr 88px 1fr 1fr;height:98px;padding-bottom:34px;position:relative;z-index:10}
.tab > a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--t2);font:600 13px/18px var(--ff)}
.tab > a .i{color:var(--ic2)}
.tab > a.on{color:var(--p)}.tab > a.on .i{color:var(--p);font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.tab > a.scanb{justify-content:flex-end;padding-bottom:7px;color:var(--p);position:relative}
.scanb .o{position:absolute;top:-48px;left:50%;margin-left:-36px;width:72px;height:72px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center}
.scanb .o span.i{width:64px;height:64px;border-radius:50%;background:var(--p);color:var(--op);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 16px rgba(20,23,28,.14)}
.selbar{flex:none;background:var(--sf);border-top:1px solid var(--ol);display:flex;height:98px;padding:0 8px 34px}
.selbar > button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:400 12px/16px var(--ff);color:var(--t1)}
.selbar > button .i{color:var(--ic)}
/* tool tile */
.tg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tt{display:flex;flex-direction:column;align-items:center;gap:4px;height:96px;padding-top:6px;border-radius:12px;position:relative;text-align:center}

.tt.add .ic{background:transparent;border:1.5px dashed var(--ols);color:var(--ic2)}

.pb{display:inline-flex;align-items:center;gap:2px;height:20px;padding:0 6px;border-radius:999px;background:var(--proc);color:var(--pro);font:600 12px/16px var(--ff);white-space:nowrap;flex:none}

:root{--e-std:cubic-bezier(.65,0,.35,1);--e-out:cubic-bezier(0,0,.2,1);--e-emph:cubic-bezier(.34,1.3,.64,1)}

@keyframes dk-menu{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes dk-toast{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes dk-morph{from{transform:translateY(-140px) scaleY(4);opacity:.5}to{transform:none;opacity:1}}
@keyframes dk-hero{from{transform:translate(-30%,-25%) scale(.2);opacity:.3}to{transform:none;opacity:1}}
@keyframes dk-draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes dk-flash{0%{opacity:.95}100%{opacity:0}}
@keyframes dk-fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--fx),var(--fy)) scale(.14);opacity:.9}}
@keyframes dk-badge{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes dk-lift{from{transform:none;box-shadow:none}to{transform:scale(1.04);box-shadow:0 6px 16px rgba(20,23,28,.25)}}

@keyframes dk-settle{0%{transform:translateY(-10px) scale(1.04)}100%{transform:none}}
