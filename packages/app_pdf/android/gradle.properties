# One machine runs both teams' builds, WSL and the emulators (DK-1070): the
# template's 8 GB heap is capped, and no daemon stays resident after a build.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The pub cache (C:) and the project (F:) are on different drives on Windows;
# Kotlin incremental compilation of plugin sources (flutter_onnxruntime) then
# fails with "this and base files have different roots" (DK-0398).
kotlin.incremental=false
