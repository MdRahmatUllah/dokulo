name: doc_vision
description: "Vision & OCR: scanner flows, edge detection, dewarp-light, OCR engines, layout, document-in-photo detection."
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  ai_core:
    path: ../ai_core
  flutter:
    sdk: flutter
  flutter_onnxruntime: 1.8.4
  image: 4.10.1
  opencv_dart: 2.2.2
  vision_ocr:
    path: ../vision_ocr

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  # PP-OCRv5 (DK-0398), fetched and hash-checked by tools/fetch_ocr_models.py.
  assets:
    - assets/ocr/
