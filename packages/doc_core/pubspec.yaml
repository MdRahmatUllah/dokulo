name: doc_core
description: "Document core: open/save/render PDFs, page ops, text extraction, structure ops, image pipeline, OCR text layer writer."
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  pdf: 3.13.1 # the invisible OCR text layer (DK-0394)
  ai_core:
    path: ../ai_core
  drift: 2.35.0
  ffi: 2.2.0
  pdfium_dart: 0.3.1
  pdfrx_engine: 0.6.1
  sqlite3: 3.6.0

dev_dependencies:
  build_runner: ^2.16.1
  crypto: ^3.0.6
  drift_dev: ^2.35.0
  lints: ^6.0.0
  test: ^1.26.0
