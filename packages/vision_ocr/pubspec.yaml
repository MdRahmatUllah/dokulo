name: vision_ocr
description: "Apple Vision text recognition for Dokulo (DK-0397): words with boxes and confidence, the default OCR on iOS."
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: VisionOcrPlugin
