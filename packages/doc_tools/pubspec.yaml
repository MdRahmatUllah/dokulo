name: doc_tools
description: "Tool jobs: one ToolJob per feature, progress stream, cancel, undo snapshot, workflow runner; the work runs on worker isolates (pdfrx's for PDFium)."
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  # doc_vision (OCR) is a Flutter package, so this is one too: `flutter test`.
  flutter:
    sdk: flutter
  ai_core:
    path: ../ai_core
  doc_core:
    path: ../doc_core
  doc_vision:
    path: ../doc_vision
  image: 4.10.1

dev_dependencies:
  pdfrx_engine: 0.6.1
  qpdf_ffi:
    path: ../qpdf_ffi
  drift: 2.35.0
  lints: ^6.0.0
  test: ^1.26.0
